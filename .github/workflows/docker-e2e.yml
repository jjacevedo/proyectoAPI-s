name: Docker Compose E2E

on:
  push:
    paths:
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-e2e.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-e2e.yml'
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        run: |
          cat > .env <<EOF
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY=${{ secrets.CEREBRAS_API_KEY }}
          POSTGRES_DB=multillm
          POSTGRES_USER=multillm
          POSTGRES_PASSWORD=multillm
          DATABASE_URL=postgresql+asyncpg://multillm:multillm@postgres:5432/multillm
          NEXT_PUBLIC_API_URL=http://localhost:8000
          EOF

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend to become healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q backend)" 2>/dev/null || echo starting)
            echo "backend health: $status"
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 3
          done
          echo "backend never became healthy"
          docker compose logs
          exit 1

      - name: Smoke test GET /health
        run: curl -sf http://localhost:8000/health

      - name: Smoke test POST /api/chat
        run: |
          http_code=$(curl -sS -o response.json -w "%{http_code}" -X POST http://localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"prompt":"¿Qué es una API?"}')
          cat response.json | python3 -m json.tool
          echo "HTTP $http_code"
          if [ "$http_code" != "200" ]; then
            echo "expected HTTP 200, got $http_code — see response body above for the real provider error"
            exit 1
          fi

      - name: Diagnostic - POST /api/chat with medium complexity (issue #18)
        if: always()
        continue-on-error: true
        run: |
          http_code=$(curl -sS -o response_medium.json -w "%{http_code}" -X POST http://localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"prompt":"Explica cómo funciona el garbage collector de Python"}')
          cat response_medium.json | python3 -m json.tool
          echo "HTTP $http_code (medium complexity -> should try 2 free providers per PROVIDER_PRIORITY)"

      - name: Diagnostic - POST /api/chat with high complexity (issue #18)
        if: always()
        continue-on-error: true
        run: |
          http_code=$(curl -sS -o response_high.json -w "%{http_code}" -X POST http://localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"prompt":"Diseña una arquitectura de microservicios escalable y segura, comparando alternativas"}')
          cat response_high.json | python3 -m json.tool
          echo "HTTP $http_code (high complexity -> should try 3 free providers: cerebras, gemini, groq)"

      - name: Verify request_logs table was migrated
        run: docker compose exec -T postgres psql -U multillm -d multillm -c '\d request_logs'

      - name: Smoke test real Wikipedia fact search (issue #13)
        run: |
          response=$(curl -sS -X POST http://localhost:8000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"prompt":"¿Quién fue Alan Turing?"}')
          echo "$response" | python3 -m json.tool
          task_type=$(echo "$response" | jq -r '.task_type')
          if [ "$task_type" != "factual" ]; then
            echo "expected task_type=factual, got $task_type"
            exit 1
          fi
          result_count=$(echo "$response" | jq '.fact_search_results | length')
          if [ "$result_count" -lt 1 ]; then
            echo "expected at least 1 fact_search_results entry, got $result_count"
            exit 1
          fi
          successful_count=$(echo "$response" | jq '[.fact_search_results[] | select(.error == null)] | length')
          if [ "$successful_count" -lt 1 ]; then
            echo "no fact_search_results entry succeeded — real Wikipedia call did not return usable data"
            exit 1
          fi
          echo "Real Wikipedia call succeeded: $successful_count/$result_count queries resolved."

      - name: Smoke test frontend
        run: curl -sf http://localhost:3000 > /dev/null

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
