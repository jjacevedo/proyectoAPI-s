services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-multillm}
      POSTGRES_USER: ${POSTGRES_USER:-multillm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multillm}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multillm} -d ${POSTGRES_DB:-multillm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      ROQ_API_KEY: ${ROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY:-}
      CEREBRAS_MODEL: ${CEREBRAS_MODEL:-gpt-oss-120b}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-meta/llama-3.1-70b-instruct}
      SYNTHESIZER_PROVIDER: ${SYNTHESIZER_PROVIDER:-cerebras}
      PROVIDER_PRIORITY: ${PROVIDER_PRIORITY:-cerebras,gemini,groq,nvidia,openai}
      ENABLE_CROSS_CRITIQUE: ${ENABLE_CROSS_CRITIQUE:-true}
      ENABLE_REEVALUATION_ROUND: ${ENABLE_REEVALUATION_ROUND:-true}
      ENABLE_CODE_VERIFICATION: ${ENABLE_CODE_VERIFICATION:-true}
      CODE_EXECUTION_TIMEOUT_SECONDS: ${CODE_EXECUTION_TIMEOUT_SECONDS:-5}
      CODE_MAX_OUTPUT_CHARS: ${CODE_MAX_OUTPUT_CHARS:-4000}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-45}
      MAX_TOKENS_PER_REQUEST: ${MAX_TOKENS_PER_REQUEST:-2048}
      MAX_PROMPT_CHARS: ${MAX_PROMPT_CHARS:-12000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://multillm:multillm@postgres:5432/multillm}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
